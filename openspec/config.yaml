context: |
  Product: Savings Goal Wallet. npm workspaces monorepo with mobile/ (React Native 0.81.x CLI host, React 19, no Expo), libreria/ (rn-savings-notifier TurboModule), and web/ (static HTML micro-app in a WebView).
  Architecture: Clean Architecture + feature-first (goals, goal-detail, notifications) with a shared kernel in core/. Redux Toolkit extraArgument for DI. Native list; deposits in the web micro-app via typed postMessage.
  Docs: docs/PLAN_EJECUCION.md freezes scope, architecture, and phase order. Frame artifacts around the Savings Goal Wallet product and this npm workspaces monorepo.

